function pstate(k,m){let o=$('#pst2');if(!o){o=document.createElement('div');o.id='pst2';document.body.appendChild(o)}o.innerHTML=k=='busy'?`<div class="spin"></div><b>${esc(m)}</b><div class="bar"><i style="width:0%"></i></div><div class="pc">0%</div>`:k=='ok'?`<div class="ok">✓</div><b>${esc(m)}</b><button class="btn" data-a="pgo">ቪዲዮዬን እይ</button>`:`<div class="ok bad">!</div><b>${esc(m)}</b><button class="btn alt" data-a="pclose">እሺ</button>`;o.style.display='flex'}
function pprog(pc,m){let o=$('#pst2');if(!o||!o.querySelector('.bar')||o.style.display=='none'){pstate('busy',m||'');o=$('#pst2')}o.querySelector('b').textContent=m||'';o.querySelector('.bar i').style.width=pc+'%';o.querySelector('.pc').textContent=pc+'%'}
async function readProg(f){if(f.size>100*1048576){pprog(30,'በመጫን ላይ…');return f}const CH=2*1048576,parts=[];try{for(let o=0;o<f.size;o+=CH){parts.push(await f.slice(o,o+CH).arrayBuffer());pprog(Math.round(Math.min(o+CH,f.size)/f.size*60),'ፋይሉን በማንበብ ላይ…')}}catch(e){pprog(30,'በመጫን ላይ…');return f}pprog(60,'ፋይሉን በማንበብ ላይ…');return new File(parts,f.name,{type:f.type||'video/mp4'})}
function showHint(){if(!$('#hint')){const h=document.createElement('div');h.id='hint';h.textContent='🔊 ድምፅ ለማብራት ስክሪኑን ይንኩ';document.body.appendChild(h)}unl=false}
let forceFirst=null;const bad=t=>{toast(t);mst('✗ '+t)};
async function dlVid(x){if(!x||!x.vf)return toast('ይህ ቪዲዮ ፋይል የለውም');try{const u=window.__blobUrl?await window.__blobUrl(x.vf):(x.vu||'/_blob/'+x.vf);if(!u)throw 0;const b=await(await fetch(u)).blob(),t=b.type||'',ext=t.includes('mp4')?'mp4':t.includes('quicktime')?'mov':'webm',f=new File([b],'zema-'+x.id+'.'+ext,{type:t||'video/webm'});
try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('ወደ ስልክዎ እየወረደ ነው')}catch(e){if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else throw e}}catch(e){if(x&&x.vu){window.open(x.vu,'_blank');toast('ቪዲዮው ተከፍቷል፤ ረዥም ጊዜ ይጫኑና አውርድ ይምረጡ')}else toast('ማውረድ አልተቻለም')}}
function diag(){const e=$('#diag');if(!e)return;const f=(l,ok)=>l+(ok?' ✓':' ✗');e.textContent=[f('ዳታቤዝ',!!db),f('መለያ',!!me),f('መጻፍ',W),f('መጫን',!!AS)].join(' · ')+(window.__local&&window.__persist===false?' ⚠ ቪዲዮዎች ገጹን ሲዘጉ ይጠፋሉ፤ ለዘላቂ ማስቀመጫ ሊንክ (https) ያድርጉት።':'')}
let db=null,U=null,me=null,W=false,myname='',names={},accPriv=new Set,shk='';
const R={videos:[],pv:[],likes:[],comments:[],clikes:[],follows:[],saves:[],accts:[]};
const A=v=>v.uid||v.u;
const nm=a=>!a?'':String(a)[0]=='@'?a:'@'+(names[a]||'ተጠቃሚ');
const sid=s=>String(s).replace(/[^\w-]/g,'_');
const needW=()=>{if(db&&W&&me)return 0;toast(!db?'ዳታቤዝ አልተገናኘም':!me?'ለመጻፍ በመለያዎ መግባት ያስፈልጋል':'የመጻፍ ፈቃድ የለዎትም');return 1};
function pushMsg(n,w,t){let c=chats.find(x=>x.n==n);if(!c){c={n,m:[]};chats.push(c)}c.m.push([w,t]);db.doc('data/users/'+me+'/chat_'+sid(n)).set({n,m:c.m}).catch(()=>toast('አልተቻለም'));if($('#sh').classList.contains('on')&&$('#cm'))chatSheet(chats.indexOf(c));inbox()}
function saveProf(){if(needW())return;db.doc('data/users/'+me+'/profile').set({bio,link,priv,blocked}).catch(()=>toast('አልተቻለም'));db.doc('accounts/'+me).set({priv}).catch(()=>{})}
function derive(){const lk={},mylk=new Set,cl={},mycl=new Set,cm={};
R.likes.forEach(x=>{lk[x.vid]=(lk[x.vid]||0)+1;if(x.uid==me)mylk.add(x.vid)});
R.clikes.forEach(x=>{cl[x.cid]=(cl[x.cid]||0)+1;if(x.uid==me)mycl.add(x.cid)});
[...R.comments].sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(x=>(cm[x.vid]=cm[x.vid]||[]).push({id:x.id,uid:x.uid,u:x.u,t:x.t,l:cl[x.id]||0,liked:mycl.has(x.id)}));
V=[...R.pv.map(d=>({...d,pv:1,priv:1})),...R.videos].map(d=>({...d,t:d.t||[],l:(d.l0||0)+(lk[d.id]||0),liked:mylk.has(d.id)?1:0,c:cm[d.id]||[]})).sort((a,b)=>(b.ts||0)-(a.ts||0));
fol=new Set(R.follows.filter(x=>x.uid==me).map(x=>x.h));saved=new Set(R.saves.filter(x=>x.uid==me).map(x=>x.vid));
accPriv=new Set(R.accts.filter(x=>x.priv).map(x=>x.id));mine=V.filter(v=>v.uid&&v.uid==me);
pref={};V.forEach(v=>v.liked&&v.t.forEach(t=>pref[t]=(pref[t]||0)+1));
const ids=[...new Set([...V.map(v=>v.uid),...R.comments.map(c=>c.uid)].filter(Boolean))].filter(i=>!(i in names));
if(ids.length&&U)U.profiles(ids).then(p=>{ids.forEach(i=>names[i]=(p[i]&&p[i].name)||'');refreshUI()}).catch(()=>{});
if(!$('#feed .v')&&V.length)feed();else refreshUI()}
function refreshUI(){$$('.v').forEach(a=>{const v=get(a.dataset.id);if(!v)return;const l=a.querySelector('[data-a=like]');l.classList.toggle('on',!!v.liked);l.querySelector('b').textContent=fmt(v.l);a.querySelector('[data-a=cm] b').textContent=v.c.length;a.querySelector('.sv').classList.toggle('on',saved.has(v.id));a.querySelector('.info strong').textContent=nm(A(v));const u=a.querySelector('u');if(u&&fol.has(A(v)))u.remove()});
if(shk=='cm'&&cur){const t=$('#ci')?$('#ci').value:'';cmSheet();$('#ci').value=t}
if($('#me').classList.contains('on'))prof();if($('#inb').classList.contains('on'))inbox();if($('#disc').classList.contains('on')&&!$('#q').value)disc()}
(async()=>{try{if(!window.__zc)return;const[d,u]=await Promise.all([__zc.use('db'),__zc.use('user')]);if(!d)return;db=d;U=u;try{AS=await __zc.use('assets')}catch(e){}
if(u){me=await u.id();const m=await u.me();myname=m.name||'';if(me){names[me]=myname;W=(await u.can('data.write'))!==false}}
diag();const sub=(q,fn)=>q.onSnapshot(fn,e=>console.error(e));
const raw=s=>s.docs.map(x=>({id:x.id,...x.data()}));
['videos','likes','comments','clikes','follows','saves'].forEach(k=>sub(db.collection(k),s=>{R[k]=raw(s);derive()}));
sub(db.collection('accounts'),s=>{R.accts=raw(s);derive()});
if(me)sub(db.collection('data/users/'+me),s=>{const a=raw(s);R.pv=a.filter(x=>x.id.startsWith('pv_')).map(x=>({...x,id:x.id.slice(3)}));
chats=a.filter(x=>x.id.startsWith('chat_')).map(x=>({n:x.n,m:x.m||[]})).sort((p,q)=>String(p.n).localeCompare(q.n));
const p=a.find(x=>x.id=='profile');if(p){bio=p.bio||bio;link=p.link||'';priv=!!p.priv;blocked=p.blocked||[]}derive()})}catch(e){console.error(e)}})();
tab='fyp';feed();mkui();disc();if(lang=='en')setLang('en');diag();
</script>
